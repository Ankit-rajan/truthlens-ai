<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#a29bfe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b894" />
      <stop offset="100%" stop-color="#55efc4" />
    </linearGradient>
  </defs>

  <!-- backdrop blob -->
  <circle cx="250" cy="210" r="180" fill="url(#bgGrad)" opacity="0.12" />

  <!-- document / article card -->
  <rect x="120" y="90" width="220" height="280" rx="18" fill="#ffffff" stroke="#e4e2fb" stroke-width="2" />
  <rect x="150" y="130" width="160" height="14" rx="7" fill="#d8d4fb" />
  <rect x="150" y="160" width="130" height="10" rx="5" fill="#eceafe" />
  <rect x="150" y="180" width="140" height="10" rx="5" fill="#eceafe" />
  <rect x="150" y="200" width="100" height="10" rx="5" fill="#eceafe" />

  <!-- verified check badge -->
  <circle cx="230" cy="270" r="34" fill="url(#accentGrad)" />
  <path d="M214 270 L226 282 L248 256" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- magnifying glass over the card, representing analysis -->
  <circle cx="340" cy="230" r="52" fill="#ffffff" stroke="url(#bgGrad)" stroke-width="10" />
  <circle cx="340" cy="230" r="30" fill="none" stroke="#6c5ce7" stroke-width="4" opacity="0.5" />
  <path d="M340 210 L340 250 M320 230 L360 230" stroke="#6c5ce7" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="378" y1="268" x2="415" y2="305" stroke="url(#bgGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- floating dots -->
  <circle cx="100" cy="110" r="6" fill="#a29bfe" />
  <circle cx="410" cy="120" r="5" fill="#00b894" />
  <circle cx="90" cy="330" r="5" fill="#6c5ce7" />
</svg>
