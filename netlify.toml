[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "bcryptjs"]

# Everything except files that already exist under public/ falls through to
# the Express app running as a Function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
